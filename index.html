<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WishCraft ✦ Create Magic</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cinzel:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Tenor+Sans&display=swap" rel="stylesheet">
</head>
<body class="creator-page">

  <!-- Animated particles bg -->
  <div class="particles" id="particles"></div>

  <div class="creator-wrap">
    <div class="creator-card">

      <!-- Top ornament bar -->
      <div class="ornament-bar">
        <span class="orn-line"></span>
        <span class="orn-diamond">◆</span>
        <span class="orn-text">W I S H C R A F T</span>
        <span class="orn-diamond">◆</span>
        <span class="orn-line"></span>
      </div>

      <div class="creator-header">
        <h1 class="logo-title">Create a<br><em>Magical Wish</em></h1>
        <p class="subtitle">Craft a stunning surprise for someone extraordinary</p>
      </div>

      <!-- Fields -->
      <div class="fields-wrap">

        <div class="field-group">
          <label class="field-label">
            <span class="label-icon">✦</span> Their Name
          </label>
          <div class="input-wrap">
            <input type="text" id="name" placeholder="Enter their name…" autocomplete="off">
            <span class="input-glow"></span>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">
            <span class="label-icon">✦</span> Occasion
          </label>
          <div class="select-wrap">
            <select id="eventType">
              <option value="birthday">🎂  Birthday</option>
              <option value="anniversary">💍  Anniversary</option>
              <option value="congrats">🎉  Congratulations</option>
              <option value="love">❤️  Love Message</option>
            </select>
            <span class="select-arrow">❯</span>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label">
            <span class="label-icon">✦</span> Photos
            <span class="optional-tag">optional</span>
          </label>
          <label class="file-drop" id="fileDrop">
            <input type="file" id="photos" accept="image/*" multiple hidden>
            <div class="file-inner">
              <div class="file-icon-wrap">
                <span class="file-icon">🖼</span>
                <div class="file-icon-ring"></div>
              </div>
              <span class="file-text">Tap to add photos</span>
              <span class="file-hint" id="fileHint">No photos — a beautiful gradient will be used</span>
            </div>
          </label>
        </div>

      </div><!-- /fields-wrap -->

      <!-- TWO GENERATE BUTTONS -->
      <div class="gen-btns-row">
        <button class="gen-btn gen-pc" onclick="generate('pc')">
          <span class="gen-icon">🖥</span>
          <span class="gen-label">PC View</span>
          <span class="gen-sub">Landscape 16:9</span>
          <div class="btn-shine"></div>
        </button>
        <button class="gen-btn gen-mobile" onclick="generate('mobile')">
          <span class="gen-icon">📱</span>
          <span class="gen-label">Mobile View</span>
          <span class="gen-sub">Portrait 9:16</span>
          <div class="btn-shine"></div>
        </button>
      </div>

      <!-- Loader -->
      <div id="loader-wrap" style="display:none">
        <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
        <p class="loader-text" id="loaderText">Preparing magic…</p>
      </div>

      <!-- Result -->
      <div id="result" style="display:none">
        <div class="divider-fancy">
          <span class="div-line"></span>
          <span class="div-gem">✦</span>
          <span class="div-line"></span>
        </div>

        <p class="result-label">✨ Your wish is ready to share ✨</p>

        <div class="link-row">
          <input type="text" id="link" readonly>
          <button class="copy-btn" onclick="copyLink()">
            <span id="copyTxt">Copy</span>
          </button>
        </div>

        <div class="action-btns">
          <button class="action-btn open-btn" onclick="goToPage()">
            <span class="abtn-icon">🎉</span>
            <span class="abtn-text">Open Wish Page</span>
            <div class="btn-shine"></div>
          </button>
          <button class="action-btn wa-btn" onclick="shareWhatsApp()">
            <span class="abtn-icon">📲</span>
            <span class="abtn-text">Share on WhatsApp</span>
            <div class="btn-shine"></div>
          </button>
          <button class="action-btn vid-btn" id="vidBtn" onclick="downloadVideo()">
            <span class="abtn-icon">🎬</span>
            <span class="abtn-text">Download as Video (1:30)</span>
            <div class="btn-shine"></div>
          </button>
        </div>
      </div>

      <!-- Video progress -->
      <div id="vidProgress" style="display:none; margin-top:20px;">
        <div class="vid-progress-label" id="vidLabel">Preparing video…</div>
        <div class="vid-progress-bar"><div class="vid-progress-fill" id="vidFill"></div></div>
      </div>

      <!-- Bottom ornament -->
      <div class="bottom-orn">✦ &nbsp; ✦ &nbsp; ✦</div>

    </div><!-- /card -->
  </div>

  <canvas id="vidCanvas" style="display:none"></canvas>

  <script>
    let generatedLink = "";
    let storedImages  = [];
    let storedName    = "";
    let storedType    = "";
    let storedView    = "mobile";

    /* ── Animated background particles ─────────────────────────── */
    (function(){
      const wrap = document.getElementById("particles");
      for(let i=0;i<55;i++){
        const d = document.createElement("div");
        d.className = "particle";
        const sz = 1.5 + Math.random()*3;
        const hue = [0,30,280,200,330][Math.floor(Math.random()*5)];
        d.style.cssText = `
          left:${Math.random()*100}%;top:${Math.random()*100}%;
          width:${sz}px;height:${sz}px;
          background:hsl(${hue},85%,75%);
          opacity:${0.2+Math.random()*0.5};
          animation-delay:${Math.random()*8}s;
          animation-duration:${6+Math.random()*10}s;
        `;
        wrap.appendChild(d);
      }
    })();

    /* ── Restore state ──────────────────────────────────────────── */
    window.addEventListener("DOMContentLoaded",()=>{
      const sn=sessionStorage.getItem("wn"),
            st=sessionStorage.getItem("wt"),
            sl=sessionStorage.getItem("wl"),
            sh=sessionStorage.getItem("wh");
      if(sn) document.getElementById("name").value=sn;
      if(st) document.getElementById("eventType").value=st;
      if(sl){
        generatedLink=sl;
        document.getElementById("link").value=sl;
        document.getElementById("result").style.display="block";
        if(sh) document.getElementById("fileHint").textContent=sh;
      }
    });

    function saveState(){
      sessionStorage.setItem("wn",document.getElementById("name").value);
      sessionStorage.setItem("wt",document.getElementById("eventType").value);
      if(generatedLink) sessionStorage.setItem("wl",generatedLink);
      sessionStorage.setItem("wh",document.getElementById("fileHint").textContent);
    }

    document.getElementById("photos").addEventListener("change",function(){
      const n=this.files.length;
      document.getElementById("fileHint").textContent = n+(n===1?" photo selected":" photos selected");
    });

    /* ── Generate ────────────────────────────────────────────────── */
    async function generate(view){
      const name  = document.getElementById("name").value.trim();
      const files = document.getElementById("photos").files;
      const type  = document.getElementById("eventType").value;

      if(!name){ shake(document.querySelector(".creator-card")); return; }

      storedName   = name;
      storedType   = type;
      storedView   = view;
      storedImages = Array.from(files);

      // Disable both buttons
      document.querySelectorAll(".gen-btn").forEach(b=>b.disabled=true);
      showLoader("Uploading photos…",0);

      let imageUrls = [];
      for(let i=0;i<files.length;i++){
        showLoader(`Uploading photo ${i+1} of ${files.length}…`, Math.round((i/files.length)*80));
        const fd=new FormData();
        fd.append("file",files[i]);
        fd.append("upload_preset","birthday_upload");
        const res  = await fetch("https://api.cloudinary.com/v1_1/ddmg7xtsl/image/upload",{method:"POST",body:fd});
        const data = await res.json();
        imageUrls.push(data.secure_url);
      }

      showLoader("Building your wish…",90);

      const base = window.location.origin + window.location.pathname.replace("index.html","");
      generatedLink = `${base}page2.html?name=${encodeURIComponent(name)}&imgs=${encodeURIComponent(JSON.stringify(imageUrls))}&type=${type}&view=${view}`;

      document.getElementById("link").value = generatedLink;
      document.getElementById("result").style.display = "block";
      saveState();
      hideLoader();
      document.querySelectorAll(".gen-btn").forEach(b=>b.disabled=false);

      // Scroll to result
      document.getElementById("result").scrollIntoView({behavior:"smooth",block:"nearest"});
    }

    function showLoader(msg,pct){
      document.getElementById("loader-wrap").style.display="block";
      document.getElementById("loaderText").textContent=msg;
      document.getElementById("loaderFill").style.width=pct+"%";
    }
    function hideLoader(){
      document.getElementById("loader-wrap").style.display="none";
    }

    function copyLink(){
      navigator.clipboard.writeText(document.getElementById("link").value);
      document.getElementById("copyTxt").textContent="✓ Copied";
      setTimeout(()=>document.getElementById("copyTxt").textContent="Copy",2200);
    }
    function goToPage(){ window.open(generatedLink,"_blank"); }
    function shareWhatsApp(){
      window.open("https://wa.me/?text="+encodeURIComponent("🎉 A Magical Surprise For You! 🎉\n"+generatedLink),"_blank");
    }
    function shake(el){
      el.classList.add("shake");
      setTimeout(()=>el.classList.remove("shake"),500);
    }

    /* ================================================================
       VIDEO — 1 min 30 sec, Canvas + MediaRecorder + Music
       ================================================================ */
    async function downloadVideo(){
      document.getElementById("vidBtn").disabled=true;
      document.getElementById("vidProgress").style.display="block";

      const isPC = storedView==="pc";
      const W = isPC?1920:720, H = isPC?1080:1280;
      const canvas=document.getElementById("vidCanvas");
      canvas.width=W; canvas.height=H;
      const ctx=canvas.getContext("2d");

      setLabel("Loading photos…"); setFill(3);

      let imgs=[];
      if(storedImages.length>0){
        imgs = await Promise.all(storedImages.map(f=>loadImg(URL.createObjectURL(f))));
      }
      setFill(8);

      const FPS=30, TOTAL_SEC=90, TOTAL_FR=FPS*TOTAL_SEC;
      const secPerImg = imgs.length>0 ? Math.max(5, TOTAL_SEC/imgs.length) : TOTAL_SEC;

      const msgMap={
        birthday:    {msg:`Happy Birthday ${storedName}`,    quotes:["May your day shine as bright as you 🌸","Wishing you endless joy & love 💖","Every year you grow more wonderful 🎉","Celebrate yourself today 🥂","You deserve all the happiness 💫"]},
        anniversary: {msg:`Happy Anniversary ${storedName}`, quotes:["Two hearts one beautiful journey 💍","Love grows deeper with every year ❤️","Here's to forever together 🌹","Your love story is extraordinary 💑","Time only makes your bond stronger ✨"]},
        congrats:    {msg:`Congratulations ${storedName}`,   quotes:["You made it happen! 🔥","We always knew you would 🎯","Sky is just the beginning 🚀","So incredibly proud of you ✨","Your hard work paid off beautifully 🏆"]},
        love:        {msg:`For You ${storedName}`,           quotes:["You are my favourite person ❤️","Every moment with you is gold 💖","I love you more every single day 🌹","You mean the whole world to me 🌍","Forever grateful you're in my life 💫"]}
      };
      const ev=msgMap[storedType]||msgMap.birthday;

      /* Confetti */
      const confettiPieces=Array.from({length:90},()=>({
        x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-0.5)*2.5,vy:0.8+Math.random()*2.5,
        r:3+Math.random()*7,
        color:`hsl(${Math.random()*360},90%,68%)`,
        spin:Math.random()*Math.PI*2,spinV:(Math.random()-0.5)*0.2,
        shape:Math.random()<0.4?"circle":"rect"
      }));

      /* Stars */
      const stars=Array.from({length:40},()=>({
        x:Math.random()*W,y:Math.random()*H*0.6,
        r:0.8+Math.random()*2,
        twinkle:Math.random()*Math.PI*2
      }));

      /* Balloons */
      const bColors=["#ff4d6d","#ffbe0b","#3a86ff","#8338ec","#fb5607","#ff006e","#06d6a0","#f72585"];
      const balloons=Array.from({length:10},(_,i)=>({
        x:W*(0.05+i*0.1),y:H+120+Math.random()*250,
        w:isPC?65:52,h:isPC?90:74,
        w2:8+Math.random()*20,h2:8+Math.random()*20,
        vy:isPC?1.0:0.8+Math.random()*0.7,
        swing:Math.random()*Math.PI*2,swingS:0.008+Math.random()*0.01,
        color:bColors[i%bColors.length]
      }));

      /* Audio */
      setLabel("Loading music…");
      let audioCtx,audioSource,audioDest;
      try{
        audioCtx=new AudioContext();
        const ab=await(await fetch("song.mp3")).arrayBuffer();
        const buf=await audioCtx.decodeAudioData(ab);
        audioDest=audioCtx.createMediaStreamDestination();
        audioSource=audioCtx.createBufferSource();
        audioSource.buffer=buf; audioSource.loop=true;
        audioSource.connect(audioDest);
        audioSource.connect(audioCtx.destination);
      }catch(e){console.warn("No audio:",e);}

      /* MediaRecorder */
      const vs=canvas.captureStream(FPS);
      const cs=new MediaStream([...vs.getVideoTracks(),...(audioDest?audioDest.stream.getAudioTracks():[])]);
      const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")?"video/webm;codecs=vp9,opus":
                  MediaRecorder.isTypeSupported("video/webm;codecs=vp8,opus")?"video/webm;codecs=vp8,opus":"video/webm";
      const rec=new MediaRecorder(cs,{mimeType:mime,videoBitsPerSecond:6_000_000});
      const chunks=[];
      rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
      rec.onstop=()=>{
        if(audioSource)audioSource.stop();
        if(audioCtx)audioCtx.close();
        setLabel("Finalising video…"); setFill(98);
        const blob=new Blob(chunks,{type:mime});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download=`wish_${storedName}_${storedView}.webm`; a.click();
        setTimeout(()=>URL.revokeObjectURL(url),8000);
        setLabel("✅ Video ready — check your downloads!");
        setFill(100);
        document.getElementById("vidBtn").disabled=false;
        document.getElementById("vidBtn").querySelector(".abtn-text").textContent="Download as Video (1:30)";
      };

      if(audioSource)audioSource.start(0);
      rec.start();
      setLabel("Recording 1:30 video with music…");
      document.getElementById("vidBtn").querySelector(".abtn-text").textContent="⏳ Recording…";

      let frame=0,quoteIdx=0,quoteTimer=0;
      const QUOTE_SWITCH=FPS*6;
      const FS=isPC?H*0.075:W*0.072; // font scale

      function renderFrame(){
        if(frame>=TOTAL_FR){rec.stop();return;}

        const t=frame/FPS;
        const progress=t/TOTAL_SEC; // 0→1

        ctx.clearRect(0,0,W,H);

        /* ─── Background ─── */
        if(imgs.length>0){
          const imgIdx=Math.min(Math.floor(t/secPerImg),imgs.length-1);
          const imgT=(t%secPerImg)/secPerImg;
          const fadeZ=0.12;
          let alpha=1;
          if(imgT<fadeZ)alpha=imgT/fadeZ;
          else if(imgT>1-fadeZ)alpha=(1-imgT)/fadeZ;
          const scale=1+imgT*0.06;
          const sw=W*scale,sh=H*scale,sx=(sw-W)/2,sy=(sh-H)/2;
          if(alpha<1&&imgIdx>0){ctx.globalAlpha=1;ctx.drawImage(imgs[imgIdx-1],-sx,-sy,sw,sh);}
          ctx.globalAlpha=alpha;
          ctx.drawImage(imgs[imgIdx],-sx,-sy,sw,sh);
          ctx.globalAlpha=1;
          // cinematic overlay
          const ov=ctx.createLinearGradient(0,0,0,H);
          ov.addColorStop(0,"rgba(0,0,0,0.25)");
          ov.addColorStop(0.45,"rgba(0,0,0,0.0)");
          ov.addColorStop(1,"rgba(0,0,0,0.80)");
          ctx.fillStyle=ov; ctx.fillRect(0,0,W,H);
          // colour tint
          ctx.fillStyle=`rgba(80,0,80,${0.08+Math.sin(t*0.3)*0.04})`;
          ctx.fillRect(0,0,W,H);
        } else {
          // No images: animated dark gradient background
          const hue1=200+Math.sin(t*0.2)*60;
          const hue2=280+Math.cos(t*0.15)*60;
          const hue3=330+Math.sin(t*0.1)*40;
          const bg=ctx.createRadialGradient(W*0.3,H*0.3,0,W*0.5,H*0.5,W*0.9);
          bg.addColorStop(0,`hsla(${hue1},60%,15%,1)`);
          bg.addColorStop(0.4,`hsla(${hue2},55%,10%,1)`);
          bg.addColorStop(0.75,`hsla(${hue3},65%,8%,1)`);
          bg.addColorStop(1,"#030009");
          ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
          // aurora wave
          for(let a=0;a<3;a++){
            const ag=ctx.createLinearGradient(0,H*(0.2+a*0.25),W,H*(0.35+a*0.25));
            ag.addColorStop(0,"transparent");
            ag.addColorStop(0.4,`hsla(${280+a*40},80%,60%,${0.06+Math.sin(t*0.4+a)*0.04})`);
            ag.addColorStop(1,"transparent");
            ctx.fillStyle=ag;
            ctx.fillRect(0,0,W,H);
          }
          // Stars
          stars.forEach(s=>{
            s.twinkle+=0.04;
            const alpha=0.3+Math.sin(s.twinkle)*0.3;
            ctx.beginPath();
            ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
            ctx.fillStyle=`rgba(255,255,255,${alpha})`;
            ctx.fill();
          });
        }

        /* ─── Confetti ─── */
        confettiPieces.forEach(p=>{
          p.x+=p.vx;p.y+=p.vy;p.spin+=p.spinV;
          if(p.y>H+10){p.y=-10;p.x=Math.random()*W;}
          ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);
          ctx.globalAlpha=0.82;
          ctx.fillStyle=p.color;
          if(p.shape==="circle"){ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();}
          else ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);
          ctx.restore();
        });

        /* ─── Balloons ─── */
        balloons.forEach(b=>{
          b.y-=b.vy; b.swing+=b.swingS;
          if(b.y<-150){b.y=H+130+Math.random()*100;}
          const sway=Math.sin(b.swing)*18;
          drawVideoBalloon(ctx,b.x+sway,b.y,b.w,b.h,b.color);
        });

        /* ─── Quote cycle ─── */
        quoteTimer++;
        if(quoteTimer>=QUOTE_SWITCH){quoteTimer=0;quoteIdx=(quoteIdx+1)%ev.quotes.length;}

        /* ─── Title (fade in 0–2.5s) ─── */
        const titleA=Math.min(1,t/2.5);
        ctx.save();
        ctx.globalAlpha=titleA;
        ctx.textAlign="center";
        // Gold gradient text
        const tg=ctx.createLinearGradient(W*0.1,0,W*0.9,0);
        tg.addColorStop(0,"#fff");
        tg.addColorStop(0.3,"#fde68a");
        tg.addColorStop(0.6,"#f9a8d4");
        tg.addColorStop(1,"#c4b5fd");
        ctx.fillStyle=tg;
        ctx.font=`bold ${FS}px 'Georgia',serif`;
        ctx.shadowColor="rgba(0,0,0,0.9)";
        ctx.shadowBlur=30;
        wrapText(ctx,ev.msg,W/2,H*0.75,W*0.88,FS*1.25);
        ctx.restore();

        /* ─── Quote ─── */
        const qFade=Math.min(1,(t-2)/1.5);
        if(qFade>0){
          ctx.save();
          ctx.globalAlpha=qFade*0.88;
          ctx.textAlign="center";
          ctx.fillStyle="#fde68a";
          ctx.font=`italic ${FS*0.52}px 'Georgia',serif`;
          ctx.shadowColor="rgba(0,0,0,0.7)";
          ctx.shadowBlur=16;
          ctx.fillText(ev.quotes[quoteIdx],W/2,H*0.88);
          ctx.restore();
        }

        /* ─── Timestamp watermark ─── */
        ctx.save();
        ctx.globalAlpha=0.25;
        ctx.fillStyle="#fff";
        ctx.font=`${W*0.018}px Georgia,serif`;
        ctx.textAlign="right";
        ctx.fillText("✦ WishCraft",W-W*0.025,H-H*0.02);
        ctx.restore();

        if(frame%30===0) setFill(8+Math.round(progress*88));
        frame++;
        requestAnimationFrame(renderFrame);
      }

      renderFrame();
    }

    function drawVideoBalloon(ctx,x,y,w,h,color){
      ctx.save();ctx.globalAlpha=0.78;
      ctx.beginPath();ctx.ellipse(x,y,w/2,h/2,0,0,Math.PI*2);
      ctx.fillStyle=color;ctx.fill();
      ctx.beginPath();ctx.ellipse(x-w*0.14,y-h*0.16,w*0.13,h*0.1,-0.5,0,Math.PI*2);
      ctx.fillStyle="rgba(255,255,255,0.35)";ctx.fill();
      ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x,y+h/2+45);
      ctx.strokeStyle="rgba(255,255,255,0.35)";ctx.lineWidth=1.5;ctx.stroke();
      ctx.restore();
    }

    function wrapText(ctx,text,x,y,maxW,lineH){
      const words=text.split(" ");let line="";const lines=[];
      for(let w of words){
        const t=line+w+" ";
        if(ctx.measureText(t).width>maxW&&line){lines.push(line.trim());line=w+" ";}
        else line=t;
      }
      if(line)lines.push(line.trim());
      const startY=y-(lines.length-1)*lineH/2;
      lines.forEach((l,i)=>ctx.fillText(l,x,startY+i*lineH));
    }

    function loadImg(src){
      return new Promise(res=>{
        const i=new Image();i.crossOrigin="anonymous";
        i.onload=()=>res(i);i.src=src;
      });
    }

    function setLabel(t){document.getElementById("vidLabel").textContent=t;}
    function setFill(p){document.getElementById("vidFill").style.width=p+"%";}
  </script>
</body>
</html>
