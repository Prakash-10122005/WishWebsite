<!DOCTYPE html>
<html>
<head>
  <title>Birthday Surprise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎂 Create Birthday Surprise</h1>

<input type="text" id="name" placeholder="Enter name"><br><br>
<input type="file" id="photo" accept="image/*"><br><br>

<button onclick="generate()">Generate</button>

<br><br>

<button onclick="goToPage()" id="goBtn" style="display:none;">
🎉 Open Birthday Page
</button>

<br><br>

<p id="shareText" style="display:none;">Share this link:</p>
<input type="text" id="link" readonly style="width:90%; display:none;">

<script>
let generatedLink = "";

async function generate() {
  const name = document.getElementById("name").value.trim();
  const file = document.getElementById("photo").files[0];

  if (!name || !file) {
    alert("Enter name and photo!");
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", "birthday_upload"); // ✅ your preset

  const res = await fetch("https://api.cloudinary.com/v1_1/ddmg7xtsl/image/upload", {
    method: "POST",
    body: formData
  });

  const data = await res.json();

  if (!data.secure_url) {
    alert("Upload failed. Check Cloudinary setup.");
    return;
  }

  const imageUrl = data.secure_url;

  // ✅ absolute link (important)
  const base = window.location.origin + "/";

  generatedLink = `${base}page2.html?name=${encodeURIComponent(name)}&img=${encodeURIComponent(imageUrl)}`;

  document.getElementById("link").value = generatedLink;
  document.getElementById("link").style.display = "block";
  document.getElementById("shareText").style.display = "block";
  document.getElementById("goBtn").style.display = "inline-block";
}

function goToPage() {
  window.location.href = generatedLink;
}
</script>

</body>
</html>
