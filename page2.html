<!DOCTYPE html>
<html>
<head>
<title>Special Wish</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

<div id="startScreen">
  <h2>🎉 Tap to Open Your Surprise 🎉</h2>
</div>

<div id="intro" style="display:none;">
  <div class="cinema-text small">A SPECIAL MOMENT</div>
  <div class="cinema-text big" id="introName"></div>
  <div class="cinema-text fade">IS HERE...</div>
</div>

<div id="main">

<h1 id="message"></h1>
<p id="quote"></p>

<!-- Slideshow -->
<div class="slideshow">
  <img id="photo" class="photo active">
</div>

<div class="balloons">
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
  <div class="balloon"></div>
</div>

<audio id="music" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const name = params.get("name") || "Friend";
const type = params.get("type") || "birthday";
const imgsParam = params.get("imgs");

let images = imgsParam ? JSON.parse(decodeURIComponent(imgsParam)) : [];

const music = document.getElementById("music");

function typeText(el, text, speed=70){
  el.innerHTML="";
  let i=0;
  function t(){
    if(i<text.length){
      el.innerHTML+=text.charAt(i);
      i++;
      setTimeout(t,speed);
    }
  }
  t();
}

function getMessage(type, name){
  if(type==="birthday") return "🎂 Happy Birthday " + name + " 💖";
  if(type==="anniversary") return "💍 Happy Anniversary " + name + " 💖";
  if(type==="congrats") return "🎉 Congratulations " + name + " 🎉";
  if(type==="love") return "❤️ Dear " + name + " 💖";
}

// 💬 Quotes based on type
function getQuotes(type){
  if(type==="birthday") return [
    "🎉 Enjoy your day 🎉",
    "💖 Stay happy always 💖",
    "🌸 You are amazing 🌸"
  ];

  if(type==="anniversary") return [
    "💍 Together forever 💍",
    "❤️ Love grows stronger ❤️",
    "🌹 Beautiful journey 🌹"
  ];

  if(type==="congrats") return [
    "🔥 You did it 🔥",
    "🎉 Proud of you 🎉",
    "✨ Keep shining ✨"
  ];

  if(type==="love") return [
    "❤️ I Love You So Much ❤️",
    "💖 You are my everything 💖",
    "🌹 Forever love 🌹"
  ];
}

// Tap start
document.getElementById("startScreen").addEventListener("click", () => {

  music.play();
  document.getElementById("startScreen").style.display="none";

  const intro = document.getElementById("intro");
  intro.style.display="flex";

  typeText(document.getElementById("introName"), name, 100);

  setTimeout(()=>{
    intro.style.display="none";

    const main = document.getElementById("main");
    main.style.display="block";
    main.classList.add("show");

    typeText(document.getElementById("message"), getMessage(type, name));

  }, 4000);
});

// 🎬 SLIDESHOW WITH FADE + ZOOM
let index = 0;
const photo = document.getElementById("photo");

function showNextImage(){
  if(images.length === 0) return;

  photo.classList.remove("active");

  setTimeout(()=>{
    photo.src = images[index];
    photo.classList.add("active");
    index = (index + 1) % images.length;
  }, 500);
}

setInterval(showNextImage, 2500);
showNextImage();

// quotes
const quotes = getQuotes(type);
let q = 0;

setInterval(()=>{
  typeText(document.getElementById("quote"), quotes[q],50);
  q = (q + 1) % quotes.length;
},3000);

// confetti
setInterval(()=>{
  confetti({particleCount:80,spread:60});
},2500);
</script>

</body>
</html>
