<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Surprise ✨</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="wish-page">

  <!-- Tap-to-start overlay -->
  <div id="startScreen">
    <div class="start-inner">
      <div class="start-ring"></div>
      <div class="start-ring r2"></div>
      <div class="start-ring r3"></div>
      <p class="start-hint">tap anywhere</p>
      <h2 class="start-title">A Special Surprise<br>Awaits You ✨</h2>
    </div>
  </div>

  <!-- Cinematic name reveal -->
  <div id="intro">
    <div class="film-grain"></div>
    <div class="intro-label">✦ &nbsp; A SPECIAL MOMENT &nbsp; ✦</div>
    <div class="intro-name" id="introName"></div>
    <div class="intro-sub">is here…</div>
  </div>

  <!-- Main wish screen -->
  <div id="main">

    <!-- Full-screen background slideshow -->
    <div class="bg-slides" id="bgSlides"></div>
    <div class="bg-overlay"></div>

    <!-- Floating petals / particles -->
    <div class="petals" id="petals"></div>

    <!-- Balloons -->
    <div class="balloons" id="balloons"></div>

    <!-- Content -->
    <div class="wish-content">
      <h1 class="wish-title" id="message"></h1>
      <p class="wish-quote" id="quote"></p>
    </div>

  </div>

  <audio id="music" loop>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const name    = params.get("name") || "Friend";
    const type    = params.get("type") || "birthday";
    const imgsRaw = params.get("imgs");
    const images  = imgsRaw ? JSON.parse(decodeURIComponent(imgsRaw)) : [];

    const music = document.getElementById("music");

    /* ---- Data ---- */
    const data = {
      birthday:    { msg:`Happy Birthday ${name}`,   quotes:["May your day be as radiant as you are 🌸","Wishing you joy, laughter & endless love 💖","Another year more wonderful 🎉"] },
      anniversary: { msg:`Happy Anniversary ${name}`, quotes:["Two hearts, one beautiful journey 💍","Love grows deeper with every passing year ❤️","Here's to forever 🌹"] },
      congrats:    { msg:`Congratulations ${name}`,   quotes:["You made it happen — we always knew you would 🔥","Proud doesn't even begin to cover it ✨","Sky is just the starting point 🚀"] },
      love:        { msg:`For You, ${name}`,           quotes:["You are my favourite person in the world ❤️","Every moment with you is a treasure 💖","I love you — more every single day 🌹"] }
    };

    const d = data[type] || data.birthday;

    /* ---- Typewriter ---- */
    function typeText(el, text, speed=60){
      el.innerHTML = "";
      let i = 0;
      (function t(){ if(i<text.length){ el.innerHTML+=text.charAt(i++); setTimeout(t,speed); } })();
    }

    /* ---- Build balloons ---- */
    const balloonColors = ["#ff4d6d","#ffbe0b","#3a86ff","#8338ec","#fb5607","#ff006e","#06d6a0"];
    const balloonWrap   = document.getElementById("balloons");
    for(let i=0;i<12;i++){
      const b = document.createElement("div");
      b.className = "balloon";
      b.style.cssText = `left:${Math.random()*95}%;background:${balloonColors[i%balloonColors.length]};animation-delay:${Math.random()*14}s;animation-duration:${10+Math.random()*8}s;width:${50+Math.random()*30}px;height:${70+Math.random()*40}px`;
      balloonWrap.appendChild(b);
    }

    /* ---- Build petals ---- */
    const petalWrap = document.getElementById("petals");
    const petalEmojis = ["🌸","🌺","✨","💫","⭐","🌹","💖"];
    for(let i=0;i<18;i++){
      const p = document.createElement("div");
      p.className = "petal";
      p.textContent = petalEmojis[i%petalEmojis.length];
      p.style.cssText = `left:${Math.random()*100}%;animation-delay:${Math.random()*12}s;animation-duration:${8+Math.random()*8}s;font-size:${14+Math.random()*18}px`;
      petalWrap.appendChild(p);
    }

    /* ---- Build bg slideshow ---- */
    const bgWrap = document.getElementById("bgSlides");
    if(images.length > 0){
      images.forEach((src,i)=>{
        const slide = document.createElement("div");
        slide.className = "bg-slide" + (i===0?" active":"");
        slide.style.backgroundImage = `url(${src})`;
        bgWrap.appendChild(slide);
      });

      let cur = 0;
      setInterval(()=>{
        const slides = bgWrap.querySelectorAll(".bg-slide");
        slides[cur].classList.remove("active");
        cur = (cur+1) % slides.length;
        slides[cur].classList.add("active");
      }, 4000);
    }

    /* ---- Tap to start ---- */
    document.getElementById("startScreen").addEventListener("click",()=>{
      music.play().catch(()=>{});
      document.getElementById("startScreen").style.opacity = "0";
      setTimeout(()=>{ document.getElementById("startScreen").style.display="none"; }, 600);

      const intro = document.getElementById("intro");
      intro.classList.add("visible");
      setTimeout(()=>typeText(document.getElementById("introName"), name, 100), 600);

      setTimeout(()=>{
        intro.classList.remove("visible");
        setTimeout(()=>{
          const main = document.getElementById("main");
          main.classList.add("visible");
          // Full title — gradient is applied via CSS on .wish-title
          document.getElementById("message").textContent = d.msg;
          startQuotes();
          fireConfetti();
        }, 600);
      }, 4200);
    });

    /* ---- Quotes ---- */
    let qi = 0;
    function startQuotes(){
      typeText(document.getElementById("quote"), d.quotes[0], 45);
      qi = 1;
      setInterval(()=>{
        typeText(document.getElementById("quote"), d.quotes[qi%d.quotes.length], 45);
        qi++;
      }, 4000);
    }

    /* ---- Confetti ---- */
    function fireConfetti(){
      confetti({ particleCount:120, spread:80, origin:{y:0.55} });
      setInterval(()=>{ confetti({ particleCount:60, spread:55, origin:{x:Math.random(), y:Math.random()*0.5+0.3} }); }, 3500);
    }
  </script>
</body>
</html>
